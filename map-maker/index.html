<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>2D Map Maker</title>
  <link rel="stylesheet" href="style.css" />

  <style>
    /* Sidebar */
    #selector {
      position: fixed;
      top: 0; left: 0;
      width: 200px; height: 100vh;
      overflow-y: auto;
      background: #f0f0f0;
      padding: 8px;
      box-sizing: border-box;
    }
    #selector img {
      display: block;
      width: 48px; height: 48px;
      margin: 4px auto;
      cursor: pointer;
      border: 2px solid transparent;
    }
    #selector img.selected {
      border-color: #0077cc;
    }

    /* Control buttons */
    #controls {
      position: fixed;
      bottom: 16px; left: 220px;
    }
    #controls button {
      margin-right: 8px;
      padding: 6px 12px;
      font-size: 14px;
    }

    /* Push the canvas right so it doesn't overlap the sidebar */
    canvas {
      margin-left: 200px;
      display: block;
    }
  </style>

  <!-- 1) Load p5 core -->
  <script src="libraries/p5.min.js"></script>
  <!-- 2) Load p5.sound if you need audio (optional) -->
  <script src="libraries/p5.sound.min.js"></script>
</head>
<body>

  <!-- Block selector sidebar -->
  <div id="selector"></div>

  <!-- Save / Load controls -->
  <div id="controls">
    <button id="save" disabled>Save Map</button>
    <button id="load">Load Map</button>
  </div>

  <!-- 3) Finally, your sketch code -->
  <script src="sketch.js"></script>
</body>
</html>
